openapi: '3.1.0'
info:
  title: Slagthuset
  version: '1.0.0'
  x-openweb:
    spec_version: '2.0'
    requires_auth: false
servers:
  - url: https://wp.slagthuset.se
    x-openweb:
      transport: node
paths:
  /wp-json/wp/v2/events:
    get:
      operationId: listEvents
      summary: List Slagthuset events from the headless WordPress behind slagthuset.se — title, link, ACF dates, times, room, price, ticket link
      x-openweb:
        permission: read
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 100
          example: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: _fields
          in: query
          required: false
          schema:
            type: string
            default: id,link,title,acf,event_medium
          example: id,link,title,acf,event_medium
      responses:
        '200':
          description: Event posts, newest published first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
